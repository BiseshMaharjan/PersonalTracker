{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h2 class="mb-0">Income by Category</h2>
    <div class="d-flex gap-2">
        <a href="{% url 'export_pdf' 'income' %}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-file-earmark-pdf"></i> Export PDF
        </a>
        <a href="{% url 'reports_landing' %}" class="btn btn-outline-secondary btn-sm">← Reports</a>
    </div>
</div>

<div class="card p-3" style="border-radius: 14px;">
    <h6 class="small">Income Breakdown (stacked by subcategory)</h6>
    <div style="height: 380px;">
        <canvas id="incomeBar"></canvas>
    </div>
</div>

<script>
new Chart(document.getElementById('incomeBar'), {
    type: 'bar',
    data: {
        labels: {{ chart_labels|safe }},
        datasets: {{ chart_datasets|safe }}
    },
    options: {
        maintainAspectRatio: false,
        scales: { x: { stacked: true }, y: { stacked: true } }
    }
});
</script>
{% endblock %}
