{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-center">
    <div class="card p-4 mt-4" style="max-width: 500px; width: 100%;">
        <h2 class="mb-3 text-center">New Subcategory under {{ parent.name }}</h2>
        <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="{{ form.name.id_for_label }}" class="form-label fw-semibold">{{ form.name.label }}</label>
            {{ form.name }}
        </div>
        <button type="submit" class="btn btn-primary w-100">Save</button>
        </form>
    </div>
</div>
{% endblock %}
