<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In - Pocket Ledger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #efedfd 0%, #f4f5fa 100%);
            margin: 0;
        }
        .auth-card {
            max-width: 400px;
            width: 100%;
            border-radius: 16px;
            border: none;
            box-shadow: 0 10px 30px rgba(108, 92, 231, 0.12);
        }
        .brand {
            font-weight: 700;
            font-size: 1.4rem;
        }
        .btn-primary {
            background: #0d6efd;
        }
        .btn-primary:hover {
            background: #0d6efd;
        }
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body>

<div class="card auth-card p-4">
    <div class="text-center mb-4">
        <div class="brand text-dark">Pocket Ledger</div>
        <p class="text-muted small mb-0">Welcome back — log in to your account</p>
    </div>

    {% if messages %}
    {% for message in messages %}
    <div class="alert alert-success py-2 small">{{ message }}</div>
    {% endfor %}
{% endif %}

    {% if form.errors %}
    <div class="alert alert-danger py-2 small">Invalid username or password. Please try again.</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="{{ form.username.id_for_label }}" class="form-label fw-semibold small">Username</label>
            <input type="text" name="username" class="form-control" id="{{ form.username.id_for_label }}" required autofocus>
        </div>
        <div class="mb-3">
            <label for="{{ form.password.id_for_label }}" class="form-label fw-semibold small">Password</label>
            <input type="password" name="password" class="form-control" id="{{ form.password.id_for_label }}" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-3">Log In</button>
        <p class="text-center small mb-0">
            No account? <a href="{% url 'signup' %}" style="color:#0d6efd ;">Sign up</a>
        </p>
    </form>
</div>

</body>
</html>
