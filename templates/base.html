<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PocketLedger{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { margin: 0; }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 220px;
            height: 100vh;
            background: #1e1e2d;
            color: #fff;
            display: flex;
            flex-direction: column;
            padding: 1rem 0;
            overflow-y: auto;
            transition: transform 0.2s ease;
            z-index: 1050;
        }
        .sidebar .brand {
            font-size: 1.25rem;
            font-weight: 600;
            padding: 0 1.25rem 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 0.5rem;
        }
        .sidebar a {
            color: #cfd2e0;
            text-decoration: none;
            padding: 0.6rem 1.25rem;
            display: block;
        }
        .sidebar a:hover, .sidebar a.active {
            background: rgba(255,255,255,0.08);
            color: #fff;
        }
        .sidebar .bottom {
            margin-top: auto;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 0.5rem;
        }

        .main-content {
            margin-left: 220px;
            padding: 1.5rem;
            background: #f4f5f9;
            min-height: 100vh;
        }

        .mobile-topbar {
            display: none;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                padding: 1rem;
            }
            .mobile-topbar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                background: #1e1e2d;
                color: #fff;
                padding: 0.75rem 1rem;
            }
            .mobile-topbar button {
                background: none;
                border: none;
                color: #fff;
                font-size: 1.5rem;
            }
        }

        .page-title2{
            font-size: 1.37rem;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 0;
        }

        .page-title {
            font-size: 1.41rem;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 0;
            margin-top: -10px;
        }
        .page-subtitle {
            font-size: 0.85rem;
            color: #6c757d;
            margin-bottom: 0;
        }
        .btn-add-action {
    background: #0d6efd ;
    color: #fff;
    border: none;
    font-size: 0.85rem;
    padding: 0.5rem 1rem;
    border-radius: 8px;
}
.btn-add-action:hover {
    background: #0d6efd ;
    color: #fff;
}
        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 0.5rem;
        }
        .card-title-sm {
            font-size: 0.85rem;
            font-weight: 600;
            color: #1a1a2e;
        }

        .search-box {
            background: #fff;
            border: 1px solid #eceefb;
            border-radius: 24px;
            padding: 0.55rem 1.1rem;
            gap: 0.6rem;
            min-width: 260px;
        }
        .search-box input {
            font-size: 0.85rem;
            width: 100%;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid #eceefb;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #444;
            font-size: 1.15rem;
        }
        .icon-btn:hover {
            background: #f4f5fa;
        }
        .notif-dot {
            position: absolute;
            top: 6px;
            right: 7px;
            width: 8px;
            height: 8px;
            background: #e55353;
            border-radius: 50%;
            border: 2px solid #fff;
        }
        .topbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: #fdfcf7;
            padding: 1rem 0;
            margin: -1.5rem -1.5rem 1rem -1.5rem;
            padding-left: 1.5rem;
            padding-right: 1.5rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body>

<div class="sidebar" id="sidebar">
    <div class="brand">Pocket Ledger</div>
    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'transaction_list' %}">Transactions</a>
    <a href="{% url 'category_list' %}">Categories</a>
    <a href="{% url 'recurring_list' %}">Recurring</a>
    <a href="{% url 'reports_landing' %}" class="{% if 'report' in request.resolver_match.url_name %}active{% endif %}">Reports</a>
    <a href="{% url 'budget_overview' %}">Budgets</a>
    <a href="{% url 'profile' %}">Profile</a>


    <div class="bottom">
        <span class="d-block px-3 pb-2 text-white-50 small">{{ user.username }}</span>
        <form action="{% url 'logout' %}" method="post" class="px-2" onsubmit="return confirm('Are you sure you want to log out?');">
            {% csrf_token %}
            <button class="btn btn-outline-light btn-sm w-100"><i class="bi bi-box-arrow-right"></i> Log Out</button>
        </form>
    </div>
</div>

<div class="mobile-topbar">
    <button onclick="document.getElementById('sidebar').classList.toggle('open')">&#9776;</button>
    <strong>Pocket Ledger</strong>
</div>

<div class="main-content">
    <div class="topbar d-flex align-items-center justify-content-between mb-4 flex-wrap gap-3">
        <div>
            <div class="page-title2 mb-0">Welcome Back, {{ user.first_name|default:user.username }}!</div>
            <div class="page-subtitle">Here's your financial overview</div>
        </div>

        <div class="d-flex align-items-center gap-3 flex-wrap">
            
                    
            

        

            <div class="dropdown">
                <button class="btn d-flex align-items-center gap-2 border-0 bg-transparent p-0" type="button" data-bs-toggle="dropdown">
                    {% if user.profile.photo %}
                        <img src="{{ user.profile.photo.url }}" class="rounded-circle" style="width:40px;height:40px;object-fit:cover;">
                    {% else %}
                        <div class="rounded-circle d-flex align-items-center justify-content-center" style="width:40px;height:40px;background:#efedfd;color:#0d6efd ;font-weight:700;">
                            {{ user.username|first|upper }}
                        </div>
                    {% endif %}
                    <div class="text-start d-none d-sm-block">
                        <div class="fw-semibold" style="line-height:1.1; font-size:0.9rem;">{{ user.first_name|default:user.username }}</div>
                        <div class="text-muted" style="font-size:0.75rem;">{{ user.profile.role|default:"User" }}</div>
                    </div>
                    <i class="bi bi-chevron-down small text-muted"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="{% url 'profile' %}">My Profile</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <form action="{% url 'logout' %}" method="post" onsubmit="return confirm('Are you sure you want to log out?');">
                            {% csrf_token %}
                            <button type="submit" class="dropdown-item text-danger">Log Out</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div class="container-fluid p-0">
        {% block content %}{% endblock %}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
